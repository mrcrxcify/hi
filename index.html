<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello, World!</title>
  <link rel="preconnect" href="https://googleapis.com" />
  <link rel="preconnect" href="https://gstatic.com" crossorigin />
  <link href="https://googleapis.com/css2?family=Outfit:wght@300;600;800&family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-dark: #090a0f;
      --accent-1: #ff6b6b;
      --accent-2: #a855f7;
      --accent-3: #38bdf8;
      --accent-4: #34d399;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--bg-dark);
      font-family: 'Outfit', sans-serif;
      overflow: hidden;
      color: #ffffff;
      position: relative;
    }

    /* Animated Aurora Orbs */
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.65;
      animation: float 12s infinite ease-in-out alternate;
      z-index: 0;
    }

    .orb-1 {
      width: 420px;
      height: 420px;
      background: var(--accent-2);
      top: -10%;
      left: 15%;
    }

    .orb-2 {
      width: 380px;
      height: 380px;
      background: var(--accent-3);
      bottom: -10%;
      right: 15%;
      animation-delay: -4s;
    }

    .orb-3 {
      width: 300px;
      height: 300px;
      background: var(--accent-1);
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      animation-delay: -8s;
    }

    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(40px, -40px) scale(1.15); }
    }

    /* Glassmorphism Card */
    .card {
      position: relative;
      z-index: 1;
      padding: 4rem 5rem;
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6),
                  inset 0 1px 1px rgba(255, 255, 255, 0.25);
      text-align: center;
      max-width: 90vw;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 35px 60px -15px rgba(168, 85, 247, 0.35),
                  inset 0 1px 1px rgba(255, 255, 255, 0.35);
    }

    .badge {
      display: inline-block;
      padding: 0.4rem 1rem;
      margin-bottom: 1.5rem;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #e2e8f0;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 999px;
    }

    h1 {
      font-size: clamp(3rem, 8vw, 5.5rem);
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, #ffffff 0%, #38bdf8 40%, #a855f7 70%, #ff6b6b 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shine 5s linear infinite;
    }

    h1 span {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-weight: 600;
    }

    @keyframes shine {
      to { background-position: 200% center; }
    }

    p {
      margin-top: 1.25rem;
      font-size: 1.1rem;
      font-weight: 300;
      color: #cbd5e1;
      letter-spacing: 0.02em;
    }

    .btn {
      margin-top: 2.25rem;
      padding: 0.85rem 2rem;
      font-family: 'Outfit', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      color: #090a0f;
      background: linear-gradient(135deg, #ffffff, #e2e8f0);
      border: none;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(255, 255, 255, 0.2);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn:hover {
      transform: scale(1.05);
      box-shadow: 0 15px 30px rgba(56, 189, 248, 0.4);
    }

    .btn:active {
      transform: scale(0.98);
    }

    /* Click Sparkle Particles */
    .sparkle {
      position: fixed;
      pointer-events: none;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      z-index: 999;
      animation: pop 0.8s ease-out forwards;
    }

    @keyframes pop {
      0% {
        transform: translate(0, 0) scale(1);
        opacity: 1;
      }
      100% {
        transform: translate(var(--dx), var(--dy)) scale(0);
        opacity: 0;
      }
    }
  </style>
</head>
<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <main class="card">
    <div class="badge">✨ Crafted in HTML & CSS</div>
    <h1>Hello, <span>World!</span></h1>
    <p>Welcome to the web—styled with glassmorphism, gradients, and motion.</p>
    <button class="btn" id="celebrateBtn">Celebrate</button>
  </main>

  <script>
    const colors = ['#ff6b6b', '#a855f7', '#38bdf8', '#34d399', '#fbbf24'];
    const btn = document.getElementById('celebrateBtn');

    function createBurst(x, y) {
      for (let i = 0; i < 24; i++) {
        const spark = document.createElement('div');
        spark.className = 'sparkle';
        const angle = (Math.PI * 2 * i) / 24;
        const velocity = 60 + Math.random() * 90;
        spark.style.left = `${x}px`;
        spark.style.top = `${y}px`;
        spark.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        spark.style.setProperty('--dx', `${Math.cos(angle) * velocity}px`);
        spark.style.setProperty('--dy', `${Math.sin(angle) * velocity}px`);
        document.body.appendChild(spark);
        setTimeout(() => spark.remove(), 800);
      }
    }

    btn.addEventListener('click', (e) => {
      const rect = btn.getBoundingClientRect();
      createBurst(rect.left + rect.width / 2, rect.top + rect.height / 2);
    });
  </script>
</body>
</html>
